services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: voyager
      POSTGRES_USER: voyager
      POSTGRES_PASSWORD: voyager
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyager -d voyager"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - voyager-postgres:/var/lib/postgresql/data

volumes:
  voyager-postgres:
